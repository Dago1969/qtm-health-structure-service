databaseChangeLog:
  - changeSet:
      id: 05-create-table-relazioni
      author: copilot
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            tableExists: {tableName: structure_departments}
      changes:
        - createTable:
            tableName: structure_departments
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: codice_struttura, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: codice_disciplina, type: VARCHAR(20), constraints: {nullable: false}}
              - column: {name: indirizzo, type: VARCHAR(500)}
        - addUniqueConstraint:
            tableName: structure_departments
            columnNames: codice_struttura, codice_disciplina
            constraintName: uk_structure_departments_key
        - addForeignKeyConstraint:
            baseTableName: structure_departments
            baseColumnNames: codice_disciplina
            referencedTableName: discipline
            referencedColumnNames: codice_disciplina
            constraintName: fk_structure_departments_discipline
        - addForeignKeyConstraint:
            baseTableName: hospital
            baseColumnNames: hospital_type_id
            referencedTableName: hospital_type
            referencedColumnNames: id
            constraintName: fk_hospital_type
        - addForeignKeyConstraint:
            baseTableName: hospital
            baseColumnNames: asl_id
            referencedTableName: asl
            referencedColumnNames: id
            constraintName: fk_hospital_asl